name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            command: npm run dist:mac
            artifact: jetflix-macos
          - name: Windows x64
            os: windows-2025
            command: npm run dist:win
            artifact: jetflix-windows
          - name: Linux x64
            os: ubuntu-24.04
            command: npm run dist:linux
            artifact: jetflix-linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools rpm

      - name: Configure public release updates
        shell: bash
        run: >-
          node -e "require('fs').writeFileSync('release-config.json',
          JSON.stringify({ githubRepository: process.env.GITHUB_REPOSITORY }, null, 2) + '\n')"

      - name: Build macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "$MAC_CSC_LINK_INPUT" ]]; then
            export CSC_LINK="$MAC_CSC_LINK_INPUT"
            export CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD_INPUT"
            export APPLE_ID="$APPLE_ID_INPUT"
            export APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_SPECIFIC_PASSWORD_INPUT"
            export APPLE_TEAM_ID="$APPLE_TEAM_ID_INPUT"
          fi
          npm run dist:mac
        env:
          MAC_CSC_LINK_INPUT: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD_INPUT: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID_INPUT: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_INPUT: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_INPUT: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if [[ -n "$WIN_CSC_LINK_INPUT" ]]; then
            export CSC_LINK="$WIN_CSC_LINK_INPUT"
            export CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_INPUT"
          fi
          npm run dist:win
        env:
          WIN_CSC_LINK_INPUT: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD_INPUT: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Smoke test Windows installer and app launch
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-smoke.ps1

      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
          if-no-files-found: error

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
