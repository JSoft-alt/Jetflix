name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-15
            command: npm run dist:mac
            artifact: jetflix-macos
          - name: Windows x64
            os: windows-2025
            command: npm run dist:win
            artifact: jetflix-windows
          - name: Linux x64
            os: ubuntu-24.04
            command: npm run dist:linux
            artifact: jetflix-linux

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes rpm

      - name: Keep private-repository updates disabled
        shell: bash
        run: >-
          node -e "require('fs').writeFileSync('release-config.json',
          JSON.stringify({ githubRepository: '' }, null, 2) + '\n')"

      - name: Build macOS installer
        if: runner.os == 'macOS'
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: ${{ matrix.command }}
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build Linux installers
        if: runner.os == 'Linux'
        run: ${{ matrix.command }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
          if-no-files-found: error

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.blockmap
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
